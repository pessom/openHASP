name: Tavern MQTT tests

on:
  push:
    branches:
      - cyd-2432s028r
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test (empty = current branch)"
        required: false
        default: ""

jobs:
  tavern:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: "true"
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-linux-${{ hashFiles('platformio.ini', 'user_setups/linux/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-linux-
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO, Tavern & Mosquitto
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio dulwich tavern
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients libsdl2-dev
      - name: Create platformio_override.ini
        run: |
          sed 's/; user_setups\/linux/user_setups\/linux/g' platformio_override-template.ini > platformio_override.ini
          mkdir -p .pio/libdeps/linux_headless/paho/src
      - name: Build linux_headless
        run: pio run -e linux_headless
      - name: Start openHASP
        run: |
          mkdir -p "$RUNNER_TEMP/plate"
          echo '{"mqtt":{"name":"plate","host":"127.0.0.1","port":1883}}' > "$RUNNER_TEMP/plate/config.json"
          sudo systemctl start mosquitto
          nohup .pio/build/linux_headless/program -c "$RUNNER_TEMP/plate" > "$RUNNER_TEMP/plate.log" 2>&1 &
          # Wait until the plate announces itself on MQTT
          mosquitto_sub -h 127.0.0.1 -t 'hasp/plate/#' -C 1 -W 60 -v
      - name: Run Tavern tests
        run: |
          cat > test/config.yaml <<'EOF'
          ---
          name: Common test information
          description: Connection information for MQTT Client

          variables:
            host: 127.0.0.1
            port: 1883
            username: test
            password: test
            plate: plate
          EOF
          python -m pytest test/ -v --junitxml="$RUNNER_TEMP/tavern-report.xml"
      - name: Upload test report and plate log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tavern-${{ inputs.ref || github.sha }}
          path: |
            ${{ runner.temp }}/tavern-report.xml
            ${{ runner.temp }}/plate.log
