name: Build CYD esp32-2432s028r

on:
  push:
    branches:
      - cyd-2432s028r
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'user_setups/esp32/_esp32.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio dulwich
      - name: Create platformio_override.ini
        run: |
          sed 's/; user_setups\/esp32/user_setups\/esp32/g' platformio_override-template.ini > platformio_override.ini
      - name: Run PlatformIO
        run: pio run -e esp32-2432s028r_4MB
      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: esp32-2432s028r_4MB
          path: build_output/firmware/*.*n
